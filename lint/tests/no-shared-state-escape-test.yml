  - |
    // ast-grep-ignore: no-discarded-result, no-shared-state
    let lock = Mutex::new(0);
  - |
    // ast-grep-ignore: no-shared-state-escape
    // ast-grep-ignore: no-shared-state
    let lock = Mutex::new(0);
  - |
