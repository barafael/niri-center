id: no-box
language: Rust
severity: error
message: "A Box allocates and, as Box<dyn _>, erases the type: hold the value directly, borrow it, make it generic, or use an enum"
note: "A boxed value can always be held, borrowed, made generic over, or be an enum variant; Box<dyn> also loses the type the compiler would check. Arc<dyn> and Rc<dyn> are refused by no-shared-state."
files:
  - "*/src/**"
rule:
  any:
    - kind: generic_type
      regex: '^((std::)?boxed::)?Box\s*<'
    - kind: scoped_identifier
      regex: '^((std::)?boxed::)?Box::'
